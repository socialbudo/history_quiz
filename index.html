<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한국 현대사 연표 & 퀴즈 마스터 (1943~2023)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================================================
       Design Tokens & Reset (Standalone CSS)
       ========================================================================== */
    :root {
      --bg-page: #f4f6fb;
      --bg-card: #ffffff;
      --bg-subtle: #f1f5f9;
      --bg-hover: #e2e8f0;
      --primary: #4338ca;
      --primary-hover: #3730a3;
      --primary-light: #eef2ff;
      --primary-border: #c7d2fe;
      --accent: #0ea5e9;
      --text-main: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --success: #10b981;
      --success-bg: #ecfdf5;
      --success-border: #a7f3d0;
      --danger: #ef4444;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --warning: #f59e0b;
      --warning-bg: #fffbeb;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.07);
      --shadow-lg: 0 12px 24px -4px rgba(15, 23, 42, 0.1);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-full: 9999px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-page: #0b1120;
        --bg-card: #1e293b;
        --bg-subtle: #0f172a;
        --bg-hover: #334155;
        --primary: #6366f1;
        --primary-hover: #818cf8;
        --primary-light: rgba(99, 102, 241, 0.15);
        --primary-border: rgba(99, 102, 241, 0.35);
        --text-main: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #64748b;
        --border: #334155;
        --success-bg: rgba(16, 185, 129, 0.15);
        --success-border: rgba(16, 185, 129, 0.4);
        --danger-bg: rgba(239, 68, 68, 0.15);
        --danger-border: rgba(239, 68, 68, 0.4);
        --warning-bg: rgba(245, 158, 11, 0.15);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 16px 72px;
    }

    @media (min-width: 640px) {
      .app-container {
        padding: 28px 24px 88px;
      }
    }

    /* ==========================================================================
       Header
       ========================================================================== */
    header.app-header {
      background: linear-gradient(135deg, #1e1b4b 0%, #3730a3 55%, #4f46e5 100%);
      color: #ffffff;
      border-radius: var(--radius-lg);
      padding: 24px 20px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
    }

    @media (min-width: 640px) {
      header.app-header {
        padding: 30px 32px;
      }
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(4px);
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .header-title {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    @media (min-width: 640px) {
      .header-title {
        font-size: 1.85rem;
      }
    }

    .header-subtitle {
      font-size: 0.9rem;
      color: #e0e7ff;
    }

    .header-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
    }

    .stat-pill {
      background: rgba(15, 23, 42, 0.3);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-pill strong {
      color: #fde047;
      font-weight: 800;
    }

    /* ==========================================================================
       Filter Section
       ========================================================================== */
    .filter-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }

    .filter-header-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .filter-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .date-only-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-light);
      border: 1px solid var(--primary-border);
      padding: 5px 11px;
      border-radius: var(--radius-full);
      cursor: pointer;
      user-select: none;
    }

    .date-only-toggle input {
      accent-color: var(--primary);
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    .era-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .era-chip {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .era-chip:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }

    .era-chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(67, 56, 202, 0.3);
    }

    .era-count {
      font-size: 0.72rem;
      opacity: 0.85;
      background: rgba(0, 0, 0, 0.12);
      padding: 1px 6px;
      border-radius: var(--radius-full);
    }

    .era-chip.active .era-count {
      background: rgba(255, 255, 255, 0.25);
    }

    /* ==========================================================================
       Mode Navigation Tabs
       ========================================================================== */
    .mode-tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    @media (min-width: 768px) {
      .mode-tabs {
        grid-template-columns: repeat(6, 1fr);
      }
    }

    .mode-tab {
      appearance: none;
      border: 1.5px solid var(--border);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 11px 8px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .mode-tab:hover {
      border-color: var(--primary-border);
      background: var(--primary-light);
      color: var(--primary);
    }

    .mode-tab.active {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(67, 56, 202, 0.15);
    }

    .mode-icon {
      font-size: 1.2rem;
    }

    .wrong-badge {
      display: inline-block;
      background: var(--danger);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: var(--radius-full);
      margin-left: 2px;
    }

    /* ==========================================================================
       Main Card & Direct Input Quiz UI
       ========================================================================== */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-md);
    }

    @media (min-width: 640px) {
      .card {
        padding: 28px;
      }
    }

    .quiz-top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .quiz-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .streak-pill {
      background: var(--warning-bg);
      color: #d97706;
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 3px 11px;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 800;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--bg-subtle);
      border-radius: var(--radius-full);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4338ca, #6366f1);
      border-radius: var(--radius-full);
      transition: width 0.3s ease;
    }

    .question-box {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 22px 20px;
      margin-bottom: 22px;
      text-align: center;
    }

    .question-tag {
      display: inline-block;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-light);
      border: 1px solid var(--primary-border);
      padding: 3px 11px;
      border-radius: var(--radius-full);
      margin-bottom: 12px;
    }

    .question-text {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text-main);
      word-break: keep-all;
      line-height: 1.5;
    }

    @media (min-width: 640px) {
      .question-text {
        font-size: 1.4rem;
      }
    }

    .question-hint {
      font-size: 0.84rem;
      color: var(--text-secondary);
      margin-top: 8px;
    }

    /* Direct Date Input Row */
    .date-input-stage {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 22px 0 14px;
    }

    .date-field-group {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
    }

    .date-num-input {
      appearance: none;
      -moz-appearance: textfield;
      border: 2px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-main);
      font-family: inherit;
      font-size: 1.45rem;
      font-weight: 800;
      text-align: center;
      padding: 12px 8px;
      border-radius: var(--radius-md);
      transition: var(--transition);
      outline: none;
    }

    .date-num-input::-webkit-outer-spin-button,
    .date-num-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .date-num-input.year-input {
      width: 108px;
    }

    .date-num-input.month-input,
    .date-num-input.day-input {
      width: 74px;
    }

    .date-num-input:focus {
      border-color: var(--primary);
      background: var(--bg-card);
      box-shadow: 0 0 0 4px rgba(67, 56, 202, 0.16);
    }

    .date-num-input.correct-field {
      border-color: var(--success);
      background: var(--success-bg);
      color: var(--success);
    }

    .date-num-input.wrong-field {
      border-color: var(--danger);
      background: var(--danger-bg);
      color: var(--danger);
    }

    .date-unit-label {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-secondary);
    }

    .keyboard-guide {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .kbd-badge {
      display: inline-block;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1px 6px;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text-secondary);
      font-family: monospace;
    }

    /* ==========================================================================
       Swipe Flashcard Mode UI
       ========================================================================== */
    .flashcard-wrapper {
      perspective: 1200px;
      max-width: 560px;
      margin: 10px auto 20px;
      user-select: none;
    }

    .flashcard {
      position: relative;
      width: 100%;
      min-height: 270px;
      background: var(--bg-subtle);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: grab;
      box-shadow: var(--shadow-md);
      transition: transform 0.25s ease, border-color 0.2s ease, background-color 0.2s ease;
      touch-action: pan-y;
    }

    .flashcard:active {
      cursor: grabbing;
    }

    .flashcard.flipped {
      background: var(--primary-light);
      border-color: var(--primary);
    }

    .fc-side-badge {
      position: absolute;
      top: 16px;
      left: 18px;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      background: var(--bg-card);
      color: var(--primary);
      border: 1px solid var(--primary-border);
    }

    .fc-era-badge {
      position: absolute;
      top: 16px;
      right: 18px;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .fc-main-text {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-main);
      word-break: keep-all;
      line-height: 1.5;
      margin-top: 12px;
    }

    @media (min-width: 640px) {
      .fc-main-text {
        font-size: 1.55rem;
      }
    }

    .fc-date-reveal {
      margin-top: 18px;
      padding: 12px 24px;
      background: var(--primary);
      color: #ffffff;
      border-radius: var(--radius-md);
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 12px rgba(67, 56, 202, 0.3);
      animation: popIn 0.22s ease;
    }

    .fc-tap-hint {
      margin-top: 16px;
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .fc-controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      max-width: 560px;
      margin: 0 auto;
    }

    /* ==========================================================================
       4-Choice & Ordering Quiz UI
       ========================================================================== */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .option-btn {
      appearance: none;
      width: 100%;
      text-align: left;
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      font-family: inherit;
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 12px;
      word-break: keep-all;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .option-num {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: var(--radius-full);
      background: var(--bg-subtle);
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .option-btn.correct {
      background: var(--success-bg);
      border-color: var(--success);
      color: var(--success);
    }

    .option-btn.correct .option-num {
      background: var(--success);
      color: #ffffff;
    }

    .option-btn.wrong {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }

    .option-btn.wrong .option-num {
      background: var(--danger);
      color: #ffffff;
    }

    .order-slots-label {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .selected-sequence {
      min-height: 76px;
      background: var(--primary-light);
      border: 1.5px dashed var(--primary-border);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .selected-empty {
      color: var(--text-muted);
      font-size: 0.86rem;
      text-align: center;
      padding: 14px 0;
    }

    .order-item {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-size: 0.94rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: var(--transition);
      user-select: none;
    }

    .order-item:hover:not(.locked) {
      border-color: var(--primary);
    }

    .order-item.in-pool.picked {
      opacity: 0.38;
      pointer-events: none;
    }

    .order-item.result-correct {
      border-color: var(--success);
      background: var(--success-bg);
    }

    .order-item.result-wrong {
      border-color: var(--danger);
      background: var(--danger-bg);
    }

    .order-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: var(--radius-full);
      background: var(--primary);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 700;
      margin-right: 8px;
      flex-shrink: 0;
    }

    .order-date-reveal {
      font-size: 0.8rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      background: rgba(15, 23, 42, 0.1);
      white-space: nowrap;
    }

    /* ==========================================================================
       Feedback & Buttons
       ========================================================================== */
    .feedback-box {
      margin-top: 18px;
      padding: 16px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      display: none;
      animation: fadeIn 0.2s ease;
    }

    .feedback-box.show {
      display: block;
    }

    .feedback-box.success {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--text-main);
    }

    .feedback-box.error {
      background: var(--danger-bg);
      border-color: var(--danger-border);
      color: var(--text-main);
    }

    .feedback-title {
      font-weight: 800;
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .feedback-box.success .feedback-title {
      color: var(--success);
    }

    .feedback-box.error .feedback-title {
      color: var(--danger);
    }

    .feedback-desc {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .action-row {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .btn {
      appearance: none;
      border: none;
      border-radius: var(--radius-md);
      padding: 12px 20px;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(67, 56, 202, 0.25);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--bg-subtle);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }

    .btn-success {
      background: var(--success);
      color: #ffffff;
    }

    .btn-danger-outline {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger-border);
    }

    .btn-danger-outline:hover {
      background: var(--danger-bg);
    }

    /* ==========================================================================
       Timeline Reference View
       ========================================================================== */
    .search-bar-wrap {
      position: relative;
      margin-bottom: 14px;
    }

    .search-input {
      width: 100%;
      padding: 13px 40px 13px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-main);
      background: var(--bg-subtle);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--primary);
      background: var(--bg-card);
    }

    .search-clear {
      position: absolute;

      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
    }

      align-items: center;
      gap: 8px;

      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .timeline-list {
      position: relative;
      padding-left: 20px;
      border-left: 2px solid var(--primary-border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .timeline-item {
      position: relative;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 16px;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -26px;
      top: 17px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
      border: 2px solid var(--bg-card);
    }

    .timeline-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 4px;
    }

    .timeline-date {
      font-size: 0.86rem;
      font-weight: 800;
      color: var(--primary);
      background: var(--primary-light);
      padding: 2px 9px;
      border-radius: var(--radius-sm);
    }

    .timeline-date.blinded,
    .timeline-event.blinded {
      filter: blur(5px);
      user-select: none;
      cursor: pointer;
    }

    .timeline-date.blinded:hover,
    .timeline-event.blinded:hover {
      filter: blur(0);
    }

    .timeline-era-tag {
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .timeline-event {
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--text-main);
      word-break: keep-all;
    }

    .empty-state,
    .result-summary {
      text-align: center;
      padding: 32px 16px;
    }

    .empty-icon {
      font-size: 2.8rem;
      margin-bottom: 10px;
    }

    .empty-title {
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .empty-desc {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .score-circle {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      background: var(--primary-light);
      border: 4px solid var(--primary);

      color: var(--text-secondary);
    }

      from { opacity: 0; transform: translateY(4px); }

    }

      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    /**
     * ==========================================================================
     * 2. 핵심 헬퍼: 날짜 표기 포맷 & 입력 필드 타입 자동 판별
     *    - 사건명 텍스트 자체에 '5.10', '6.25', '4.19', '10월' 등 날짜가 드러나면
     *      연도(*년) 입력칸 1개만 생성합니다!
     * ==========================================================================
     */
    function formatFullDate(item) {
      let str = `${item.year}.`;
      if (item.month !== null) str += ` ${item.month}.`;
      if (item.day !== null) str += ` ${item.day}.`;
      return str;
    }

    function hasDateInEventText(eventText) {
      // "5.10", "6.25", "10.26", "1.4", "4.3", "3.1절", "10월 유신" 등 날짜가 사건명에 이미 포함된 경우 판별
      return /\b\d{1,2}\.\d{1,2}\b/.test(eventText) || /\b10월\s*유신/.test(eventText);
    }

    /**
     * 입력칸 구성 결정:
     * - 'YMD': *년 *월 *일 (3칸) -> month와 day가 모두 있고, 사건명에 날짜가 드러나지 않은 경우
     * - 'YM' : *년 *월 (2칸)     -> month만 있고 day가 없으며, 사건명에 날짜가 드러나지 않은 경우
     * - 'Y'  : *년 (1칸)         -> 연도만 있거나, 사건명 자체에 이미 날짜가 적혀 있는 경우
     */
    function getInputRequirement(item) {
      if (hasDateInEventText(item.event)) {
        return "Y";
      }
      if (item.month !== null && item.day !== null) {
        return "YMD";
      }
      if (item.month !== null) {
        return "YM";
      }
      return "Y";
    }

    const ERAS = [
      { id: "all", label: "전체", min: 1940, max: 2030 },
      { id: "era1", label: "해방·정부 수립", min: 1943, max: 1949 },
      { id: "era2", label: "6·25·이승만 정부", min: 1950, max: 1960 },
      { id: "era3", label: "박정희 정부", min: 1961, max: 1979 },
      { id: "era4", label: "전두환·6월 항쟁", min: 1980, max: 1987 },
      { id: "era5", label: "민주화 이후·과거사", min: 1988, max: 2023 }
    ];

    function getEraLabel(year) {
      const found = ERAS.slice(1).find(e => year >= e.min && year <= e.max);
      return found ? found.label : "현대사";
    }

    /**
     * ==========================================================================
     * 3. 상태 관리 및 LocalStorage
     * ==========================================================================
     */
    const STORAGE_KEY = "kr_modern_history_v2_wrong";

    const state = {
      selectedEra: "all",
      onlyWithDay: false,
      currentMode: "input-quiz", // 'input-quiz' | 'flashcard' | 'event-quiz' | 'order-quiz' | 'wrong-review' | 'timeline'
      streak: 0,
      wrongIds: new Set(),

      // Quiz Session State
      quizPool: [],
      currentIndex: 0,
      score: 0,
      answered: false,
      currentQuestion: null,

      // Flashcard State
      fcPool: [],
      fcIndex: 0,
      fcFlipped: false,
      fcKnownCount: 0,

      // Ordering Quiz State
      orderPool: [],
      orderSelected: [],

      // Timeline State
      searchQuery: "",
      blindMode: false
    };

    function loadWrongIds() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) state.wrongIds = new Set(parsed);
        }
      } catch (e) {}
    }

    function saveWrongIds() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...state.wrongIds]));
      } catch (e) {}
      updateHeaderStats();
    }

    function addWrongId(id) {
      state.wrongIds.add(id);
      saveWrongIds();
    }

    function removeWrongId(id) {
      if (state.wrongIds.has(id)) {
        state.wrongIds.delete(id);
        saveWrongIds();
      }
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function getFilteredEvents() {
      const era = ERAS.find(e => e.id === state.selectedEra) || ERAS[0];
      return HISTORY_EVENTS.filter(item => {
        const inEra = item.year >= era.min && item.year <= era.max;
        if (!inEra) return false;
        if (state.onlyWithDay) {
          return item.month !== null && item.day !== null;
        }
        return true;
      });
    }

    function updateHeaderStats() {
      const filtered = getFilteredEvents();
      document.getElementById("totalCountStat").textContent = `${HISTORY_EVENTS.length}개`;
      document.getElementById("headerStreakStat").textContent = `${state.streak}연속`;
      document.getElementById("headerWrongStat").textContent = `${state.wrongIds.size}개`;
      document.getElementById("tabWrongBadge").textContent = state.wrongIds.size;

      const eraObj = ERAS.find(e => e.id === state.selectedEra);
      document.getElementById("selectedEraInfo").textContent = `${eraObj.label} · ${filtered.length}개`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    /**
     * ==========================================================================
     * 4. 필터 칩 및 탭 바인딩
     * ==========================================================================
     */
    function renderEraChips() {
      const container = document.getElementById("eraChips");
      container.innerHTML = ERAS.map(era => {
        const count = HISTORY_EVENTS.filter(item => {
          const inEra = item.year >= era.min && item.year <= era.max;
          if (!inEra) return false;
          return state.onlyWithDay ? item.month !== null && item.day !== null : true;
        }).length;
        const active = state.selectedEra === era.id ? "active" : "";
        return `
          <button class="era-chip ${active}" data-era="${era.id}">
            <span>${era.label}</span>
            <span class="era-count">${count}</span>
          </button>
        `;
      }).join("");

      container.querySelectorAll(".era-chip").forEach(btn => {
        btn.addEventListener("click", () => {
          state.selectedEra = btn.dataset.era;
          renderEraChips();
          updateHeaderStats();
          initCurrentMode();
        });
      });
    }

    function bindFiltersAndTabs() {
      const dayCheckbox = document.getElementById("onlyWithDayCheckbox");
      dayCheckbox.addEventListener("change", e => {
        state.onlyWithDay = e.target.checked;
        renderEraChips();
        updateHeaderStats();
        initCurrentMode();
      });

      document.querySelectorAll(".mode-tab").forEach(tab => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".mode-tab").forEach(t => t.classList.remove("active"));
          tab.classList.add("active");
          state.currentMode = tab.dataset.mode;
          initCurrentMode();
        });
      });
    }

    /**
     * ==========================================================================
     * 5. 모드 라우팅
     * ==========================================================================
     */
    function initCurrentMode() {
      updateHeaderStats();
      const mode = state.currentMode;

      if (mode === "input-quiz") {
        startDirectInputSession(getFilteredEvents(), false);
      } else if (mode === "wrong-review") {
        const wrongItems = HISTORY_EVENTS.filter(item => state.wrongIds.has(item.id));
        startDirectInputSession(wrongItems, true);
      } else if (mode === "flashcard") {
        startFlashcardSession();
      } else if (mode === "event-quiz") {
        startEventChoiceSession();
      } else if (mode === "order-quiz") {
        startOrderQuizSession();
      } else if (mode === "timeline") {
        renderTimelineView();
      }
    }

    /**
     * ==========================================================================
     * 6. [핵심 기능 1] 직접 입력형 연도/날짜 퀴즈 + 스마트 오토포커스 + Enter 2단계 제어
     * ==========================================================================
     */
    function startDirectInputSession(items, isWrongReview) {
      const shuffled = shuffle(items);
      state.quizPool = shuffled;
      state.currentIndex = 0;
      state.score = 0;
      state.answered = false;

      if (state.quizPool.length === 0) {
        if (isWrongReview) {
          renderEmptyWrongNote();
        } else {
          renderNoFilterMatch();
        }
        return;
      }

      renderDirectInputQuestion();
    }

    function renderDirectInputQuestion() {
      const main = document.getElementById("mainContent");
      const target = state.quizPool[state.currentIndex];
      const reqType = getInputRequirement(target); // 'YMD' | 'YM' | 'Y'
      const total = state.quizPool.length;
      const current = state.currentIndex + 1;
      const progressPct = Math.round(((current - 1) / total) * 100);

      state.answered = false;
      state.currentQuestion = { target, reqType };

      let reqDescription = "";
      if (reqType === "YMD") {
        reqDescription = "정확한 연·월·일(3칸)을 입력하세요.";
      } else if (reqType === "YM") {
        reqDescription = "연도와 월(2칸)을 입력하세요.";
      } else {
        reqDescription = hasDateInEventText(target.event)
          ? "사건명에 날짜가 포함되어 있으므로 연도(1칸)만 입력하세요."
          : "발생 연도(1칸)를 입력하세요.";
      }

      const modeTitle =
        state.currentMode === "wrong-review"
          ? `📌 오답 노트 집중 복습 · ${reqType === "YMD" ? "연·월·일 입력" : reqType === "YM" ? "연·월 입력" : "연도 입력"}`
          : `⌨️ 직접 입력 퀴즈 · ${reqType === "YMD" ? "연·월·일 (3칸)" : reqType === "YM" ? "연·월 (2칸)" : "연도 (1칸)"}`;

      main.innerHTML = `
        <div class="quiz-top-bar">
          <div class="quiz-meta">
            <span>문제 ${current} / ${total}</span>
            <span>·</span>
            <span>정답 ${state.score}개</span>
          </div>
          <div class="streak-pill">🔥 ${state.streak}연속 정답</div>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width: ${progressPct}%"></div>
        </div>

        <div class="question-box">
          <div class="question-tag">${modeTitle}</div>
          <div class="question-text">${escapeHtml(target.event)}</div>
          <div class="question-hint">${reqDescription}</div>
        </div>

        <div class="date-input-stage" id="dateInputStage">
          <div class="date-field-group">
            <input
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="4"
              id="inpYear"
              class="date-num-input year-input"
              placeholder="YYYY"
              autocomplete="off"
              aria-label="연도 입력"
            />
            <span class="date-unit-label">년</span>
          </div>

          ${
            reqType === "YM" || reqType === "YMD"
              ? `
            <div class="date-field-group">
              <input
                type="text"
                inputmode="numeric"
                pattern="[0-9]*"
                maxlength="2"
                id="inpMonth"
                class="date-num-input month-input"
                placeholder="MM"
                autocomplete="off"
                aria-label="월 입력"
              />
              <span class="date-unit-label">월</span>
            </div>
          `
              : ""
          }

          ${
            reqType === "YMD"
              ? `
            <div class="date-field-group">
              <input
                type="text"
                inputmode="numeric"
                pattern="[0-9]*"
                maxlength="2"
                id="inpDay"
                class="date-num-input day-input"
                placeholder="DD"
                autocomplete="off"
                aria-label="일 입력"
              />
              <span class="date-unit-label">일</span>
            </div>
          `
              : ""
          }
        </div>

        <div class="keyboard-guide">
          숫자 입력 시 다음 칸 자동 이동 · <span class="kbd-badge">Enter</span> 1회: 채점 / <span class="kbd-badge">Enter</span> 2회: 다음 문제(리셋)
        </div>

        <div class="feedback-box" id="feedbackBox"></div>

        <div class="action-row">
          ${
            state.currentMode === "wrong-review"
              ? `<button class="btn btn-danger-outline" id="clearWrongBtn">오답 노트 비우기</button>`
              : `<button class="btn btn-secondary" id="reshuffleQuizBtn">🔄 처음부터 다시 섞기</button>`
          }
          <button class="btn btn-primary" id="submitOrNextBtn">채점하기 (Enter)</button>
        </div>
      `;

      setupSmartDateInputs(reqType);

      const actionBtn = document.getElementById("submitOrNextBtn");
      actionBtn.addEventListener("click", () => {
        if (!state.answered) {
          evaluateDirectInput();
        } else {
          goNextDirectInputQuestion();
        }
      });

      const reshuffleBtn = document.getElementById("reshuffleQuizBtn");
      if (reshuffleBtn) {
        reshuffleBtn.addEventListener("click", initCurrentMode);
      }

      const clearBtn = document.getElementById("clearWrongBtn");
      if (clearBtn) {
        clearBtn.addEventListener("click", () => {
          state.wrongIds.clear();
          saveWrongIds();
          renderEmptyWrongNote();
        });
      }
    }

    /**
     * 스마트 오토포커스 로직:
     * - 연도 4자리 입력 완료 -> 월 입력창으로 즉시 포커스 이동
     * - 월 2자리 입력 또는 '2'~'9' 입력 시(예: 3월, 8월은 두 자릿수 월이 없으므로 즉시 일 입력창으로 이동) -> 일 입력창으로 자동 포커스 이동
     * - Backspace로 빈 칸에서 지울 때 이전 칸으로 자연스럽게 복귀
     */
    function setupSmartDateInputs(reqType) {
      const inpYear = document.getElementById("inpYear");
      const inpMonth = document.getElementById("inpMonth");
      const inpDay = document.getElementById("inpDay");

      if (!inpYear) return;

      // 첫 입력창 자동 포커스
      setTimeout(() => inpYear.focus(), 20);

      // 숫자 이외 문자 제거 필터
      const sanitizeDigits = el => {
        el.value = el.value.replace(/[^0-9]/g, "");
      };

      inpYear.addEventListener("input", () => {
        sanitizeDigits(inpYear);
        if (inpYear.value.length === 4 && inpMonth) {
          inpMonth.focus();
          inpMonth.select();
        }
      });

      if (inpMonth) {
        inpMonth.addEventListener("input", () => {
          sanitizeDigits(inpMonth);
          const val = inpMonth.value;
          // 2자리를 채웠거나, 첫 글자가 2~9인 경우(2월~9월은 뒤에 숫자가 더 붙을 수 없음) 즉시 일(day) 칸으로 이동
          if (inpDay && (val.length === 2 || (val.length === 1 && Number(val) >= 2 && Number(val) <= 9))) {
            inpDay.focus();
            inpDay.select();
          }
        });

        inpMonth.addEventListener("keydown", e => {
          if (e.key === "Backspace" && inpMonth.value === "") {
            inpYear.focus();
          }
        });
      }

      if (inpDay) {
        inpDay.addEventListener("input", () => {
          sanitizeDigits(inpDay);
        });

        inpDay.addEventListener("keydown", e => {
          if (e.key === "Backspace" && inpDay.value === "" && inpMonth) {
            inpMonth.focus();
          }
        });
      }
    }

    function evaluateDirectInput() {
      if (state.answered) return;

      const { target, reqType } = state.currentQuestion;
      const inpYear = document.getElementById("inpYear");
      const inpMonth = document.getElementById("inpMonth");
      const inpDay = document.getElementById("inpDay");

      const userYear = Number(inpYear.value.trim());
      const userMonth = inpMonth ? Number(inpMonth.value.trim()) : null;
      const userDay = inpDay ? Number(inpDay.value.trim()) : null;

      // 아무것도 입력하지 않았을 때는 연도 칸에 포커스 유도
      if (!inpYear.value.trim()) {
        inpYear.focus();
        return;
      }

      state.answered = true;

      const yearOk = userYear === target.year;
      const monthOk = reqType === "Y" ? true : userMonth === target.month;
      const dayOk = reqType !== "YMD" ? true : userDay === target.day;
      const isAllCorrect = yearOk && monthOk && dayOk;

      // 각 칸별 시각적 정답/오답 표시 및 잠금
      inpYear.readOnly = true;
      inpYear.classList.add(yearOk ? "correct-field" : "wrong-field");

      if (inpMonth) {
        inpMonth.readOnly = true;
        inpMonth.classList.add(monthOk ? "correct-field" : "wrong-field");
      }

      if (inpDay) {
        inpDay.readOnly = true;
        inpDay.classList.add(dayOk ? "correct-field" : "wrong-field");
      }

      const feedback = document.getElementById("feedbackBox");
      const fullDateStr = formatFullDate(target);
      const eraName = getEraLabel(target.year);

      if (isAllCorrect) {
        state.score++;
        state.streak++;
        removeWrongId(target.id);
        feedback.className = "feedback-box success show";
        feedback.innerHTML = `
          <div class="feedback-title">✅ 정답입니다! (Enter를 한 번 더 누르면 다음 문제로 넘어갑니다)</div>
          <div class="feedback-desc">
            <strong>[${escapeHtml(fullDateStr)}]</strong> ${escapeHtml(target.event)} · <span>${eraName}</span>
          </div>
        `;
      } else {
        state.streak = 0;
        addWrongId(target.id);
        feedback.className = "feedback-box error show";
        feedback.innerHTML = `
          <div class="feedback-title">❌ 오답입니다! (Enter를 한 번 더 누르면 다음 문제로 넘어갑니다)</div>
          <div class="feedback-desc">
            정답은 <strong>[${escapeHtml(fullDateStr)}]</strong> 입니다. (${escapeHtml(target.event)} · ${eraName})
          </div>
        `;
      }

      updateHeaderStats();
      const actionBtn = document.getElementById("submitOrNextBtn");
      const isLast = state.currentIndex + 1 >= state.quizPool.length;
      actionBtn.textContent = isLast ? "결과 보기 (Enter)" : "다음 문제 → (Enter)";
      actionBtn.focus();
    }

    function goNextDirectInputQuestion() {
      if (state.currentIndex + 1 < state.quizPool.length) {
        state.currentIndex++;
        renderDirectInputQuestion();
      } else {
        renderQuizResult();
      }
    }

    /**
     * 전역 Enter 키 리스너 (직접 입력 퀴즈에서 엔터 1회 = 채점, 엔터 2회 = 리셋/다음 문제)
     */
    document.addEventListener("keydown", e => {
      if (state.currentMode === "input-quiz" || state.currentMode === "wrong-review") {
        if (e.key === "Enter") {
          // 결과 화면이나 빈 화면이 아닐 때만 동작
          if (!state.currentQuestion || state.quizPool.length === 0) return;
          e.preventDefault();
          if (!state.answered) {
            evaluateDirectInput();
          } else {
            goNextDirectInputQuestion();
          }
        }
      } else if (state.currentMode === "flashcard") {
        if (state.fcPool.length === 0) return;
        if (e.key === " " || e.key === "ArrowUp" || e.key === "ArrowDown") {
          e.preventDefault();
          toggleFlashcardFlip();
        } else if (e.key === "ArrowLeft") {
          e.preventDefault();
          advanceFlashcard(false);
        } else if (e.key === "ArrowRight") {
          e.preventDefault();
          advanceFlashcard(true);
        }
      }
    });

    /**
     * ==========================================================================
     * 7. [핵심 기능 2] 스와이프 모드 (플래시카드: 사건 앞면 -> 날짜 뒷면)
     * ==========================================================================
     */
    function startFlashcardSession() {
      const pool = getFilteredEvents();
      state.fcPool = shuffle(pool);
      state.fcIndex = 0;
      state.fcFlipped = false;
      state.fcKnownCount = 0;

      if (state.fcPool.length === 0) {
        renderNoFilterMatch();
        return;
      }

      renderFlashcard();
    }

    function toggleFlashcardFlip() {
      state.fcFlipped = !state.fcFlipped;
      renderFlashcard();
    }

    function advanceFlashcard(isKnown) {
      const currentItem = state.fcPool[state.fcIndex];
      if (!currentItem) return;

      if (isKnown) {
        state.fcKnownCount++;
        removeWrongId(currentItem.id);
      } else {
        addWrongId(currentItem.id);
      }

      if (state.fcIndex + 1 < state.fcPool.length) {
        state.fcIndex++;
        state.fcFlipped = false;
        renderFlashcard();
      } else {
        renderFlashcardComplete();
      }
    }

    function renderFlashcard() {
      const main = document.getElementById("mainContent");
      const item = state.fcPool[state.fcIndex];
      const total = state.fcPool.length;
      const current = state.fcIndex + 1;
      const progressPct = Math.round(((current - 1) / total) * 100);
      const dateStr = formatFullDate(item);

      main.innerHTML = `
        <div class="quiz-top-bar">
          <div class="quiz-meta">
            <span>🃏 카드 ${current} / ${total}</span>
            <span>·</span>
            <span>암기 완료 ${state.fcKnownCount}개</span>
          </div>
          <div class="streak-pill">좌우 스와이프 / 클릭 뒤집기</div>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width: ${progressPct}%"></div>
        </div>

        <div class="flashcard-wrapper">
          <div class="flashcard ${state.fcFlipped ? "flipped" : ""}" id="swipeCard">
            <span class="fc-side-badge">${state.fcFlipped ? "뒷면 · 정확한 날짜" : "앞면 · 역사적 사건"}</span>
            <span class="fc-era-badge">${getEraLabel(item.year)}</span>

            <div class="fc-main-text">${escapeHtml(item.event)}</div>

            ${
              state.fcFlipped
                ? `<div class="fc-date-reveal">📅 ${escapeHtml(dateStr)}</div>`
                : `<div class="fc-tap-hint">카드를 터치하거나 클릭하면 날짜가 공개됩니다</div>`
            }
          </div>
        </div>

        <div class="fc-controls">
          <button class="btn btn-danger-outline" id="fcUnknownBtn" title="왼쪽 스와이프 (←)">
            ← 헷갈려요 (오답저장)
          </button>
          <button class="btn btn-secondary" id="fcFlipBtn" title="스페이스바">
            🔄 날짜 ${state.fcFlipped ? "숨기기" : "보기"}
          </button>
          <button class="btn btn-success" id="fcKnownBtn" title="오른쪽 스와이프 (→)">
            외웠어요 →
          </button>
        </div>

        <div class="keyboard-guide" style="margin-top:14px;">
          모바일/마우스: 카드를 <strong>좌우로 스와이프</strong>하여 넘기기 · 키보드: <span class="kbd-badge">Space</span> 뒤집기, <span class="kbd-badge">←</span>/<span class="kbd-badge">→</span> 넘기기
        </div>
      `;

      const cardEl = document.getElementById("swipeCard");
      let startX = 0;
      let currentX = 0;
      let isDragging = false;

      const onPointerDown = x => {
        startX = x;
        currentX = x;
        isDragging = true;
        cardEl.style.transition = "none";
      };

      const onPointerMove = x => {
        if (!isDragging) return;
        currentX = x;
        const deltaX = currentX - startX;
        const rotate = deltaX * 0.04;
        cardEl.style.transform = `translateX(${deltaX}px) rotate(${rotate}deg)`;
        if (deltaX > 40) {
          cardEl.style.borderColor = "var(--success)";
        } else if (deltaX < -40) {
          cardEl.style.borderColor = "var(--danger)";
        } else {
          cardEl.style.borderColor = state.fcFlipped ? "var(--primary)" : "var(--border)";
        }
      };

      const onPointerUp = () => {
        if (!isDragging) return;
        isDragging = false;
        const deltaX = currentX - startX;
        cardEl.style.transition = "transform 0.25s ease, border-color 0.2s ease";

        if (Math.abs(deltaX) < 10) {
          // 단순 클릭/터치 -> 카드 뒤집기
          cardEl.style.transform = "";
          toggleFlashcardFlip();
        } else if (deltaX > 85) {
          // 오른쪽 스와이프 -> 외웠어요
          cardEl.style.transform = "translateX(120%) rotate(12deg)";
          setTimeout(() => advanceFlashcard(true), 160);
        } else if (deltaX < -85) {
          // 왼쪽 스와이프 -> 헷갈려요
          cardEl.style.transform = "translateX(-120%) rotate(-12deg)";
          setTimeout(() => advanceFlashcard(false), 160);
        } else {
          // 원위치 복귀
          cardEl.style.transform = "";
          cardEl.style.borderColor = state.fcFlipped ? "var(--primary)" : "var(--border)";
        }
      };

      // Touch Events
      cardEl.addEventListener("touchstart", e => onPointerDown(e.touches[0].clientX), { passive: true });
      cardEl.addEventListener("touchmove", e => onPointerMove(e.touches[0].clientX), { passive: true });
      cardEl.addEventListener("touchend", onPointerUp);

      // Mouse Events
      cardEl.addEventListener("mousedown", e => onPointerDown(e.clientX));
      window.addEventListener("mousemove", e => {
        if (isDragging) onPointerMove(e.clientX);
      });
      window.addEventListener("mouseup", () => {
        if (isDragging) onPointerUp();
      });

      document.getElementById("fcFlipBtn").addEventListener("click", toggleFlashcardFlip);
      document.getElementById("fcKnownBtn").addEventListener("click", () => advanceFlashcard(true));
      document.getElementById("fcUnknownBtn").addEventListener("click", () => advanceFlashcard(false));
    }

    function renderFlashcardComplete() {
      const main = document.getElementById("mainContent");
      const total = state.fcPool.length;
      const pct = Math.round((state.fcKnownCount / total) * 100);

      main.innerHTML = `
        <div class="result-summary">
          <div class="score-circle">
            <span class="score-num">${pct}%</span>
            <span class="score-label">${state.fcKnownCount} / ${total} 암기</span>
          </div>
          <h2 class="empty-title">플래시카드 1회독 완료!</h2>
          <p class="empty-desc">
            왼쪽으로 스와이프한 헷갈리는 사건들은 오답 노트에 자동 등록되었습니다.
          </p>
          <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
            <button class="btn btn-primary" id="restartFcBtn">🔄 카드 다시 섞어서 학습</button>
            <button class="btn btn-secondary" id="goInputFromFcBtn">⌨️ 직접 날짜 입력 테스트하기</button>
          </div>
        </div>
      `;

      document.getElementById("restartFcBtn").addEventListener("click", startFlashcardSession);
      document.getElementById("goInputFromFcBtn").addEventListener("click", () => {
        document.querySelectorAll(".mode-tab").forEach(t => {
          t.classList.toggle("active", t.dataset.mode === "input-quiz");
        });
        state.currentMode = "input-quiz";
        initCurrentMode();
      });
    }

    /**
     * ==========================================================================
     * 8. 사건 맞히기 (4지 선다형)
     * ==========================================================================
     */
    function startEventChoiceSession() {
      const pool = getFilteredEvents();
      const shuffled = shuffle(pool);
      state.quizPool = shuffled;
      state.currentIndex = 0;
      state.score = 0;
      state.answered = false;

      if (state.quizPool.length === 0) {
        renderNoFilterMatch();
        return;
      }

      prepareNextEventChoice();
    }

    function prepareNextEventChoice() {
      const target = state.quizPool[state.currentIndex];
      const targetDateStr = formatFullDate(target);

      const candidates = HISTORY_EVENTS.filter(
        item => item.id !== target.id && formatFullDate(item) !== targetDateStr && item.event !== target.event
      ).sort((a, b) => Math.abs(a.year - target.year) - Math.abs(b.year - target.year));

      const closePool = shuffle(candidates.slice(0, 14)).slice(0, 3);
      const options = shuffle([target, ...closePool]);

      state.answered = false;
      state.currentQuestion = { target, options };
      renderEventChoice();
    }

    function renderEventChoice() {
      const main = document.getElementById("mainContent");
      const { target, options } = state.currentQuestion;
      const total = state.quizPool.length;
      const current = state.currentIndex + 1;
      const progressPct = Math.round(((current - 1) / total) * 100);

      main.innerHTML = `
        <div class="quiz-top-bar">
          <div class="quiz-meta">
            <span>문제 ${current} / ${total}</span>
            <span>·</span>
            <span>득점 ${state.score}점</span>
          </div>
          <div class="streak-pill">🔥 ${state.streak}연속 정답</div>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width: ${progressPct}%"></div>
        </div>

        <div class="question-box">
          <div class="question-tag">🏛️ 사건 맞히기 (4지 선다)</div>
          <div class="question-text">${escapeHtml(formatFullDate(target))}</div>
          <div class="question-hint">위 날짜/시기에 발생한 역사적 사건을 고르세요.</div>
        </div>

        <div class="options-grid">
          ${options
            .map(
              (opt, idx) => `
            <button class="option-btn" data-id="${opt.id}">
              <span class="option-num">${idx + 1}</span>
              <span>${escapeHtml(opt.event)}</span>
            </button>
          `
            )
            .join("")}
        </div>

        <div class="feedback-box" id="feedbackBox"></div>

        <div class="action-row">
          <button class="btn btn-primary" id="nextEventBtn" disabled>
            ${current === total ? "결과 보기" : "다음 문제 →"}
          </button>
        </div>
      `;

      document.querySelectorAll(".option-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          if (state.answered) return;
          state.answered = true;
          const pickedId = Number(btn.dataset.id);
          const isCorrect = pickedId === target.id;

          document.querySelectorAll(".option-btn").forEach(b => {
            b.disabled = true;
            const bId = Number(b.dataset.id);
            if (bId === target.id) b.classList.add("correct");
            else if (bId === pickedId && !isCorrect) b.classList.add("wrong");
          });

          const feedback = document.getElementById("feedbackBox");
          if (isCorrect) {
            state.score++;
            state.streak++;
            removeWrongId(target.id);
            feedback.className = "feedback-box success show";
            feedback.innerHTML = `<div class="feedback-title">✅ 정답입니다!</div><div class="feedback-desc"><strong>[${escapeHtml(
              formatFullDate(target)
            )}]</strong> ${escapeHtml(target.event)}</div>`;
          } else {
            state.streak = 0;
            addWrongId(target.id);
            feedback.className = "feedback-box error show";
            feedback.innerHTML = `<div class="feedback-title">❌ 오답입니다.</div><div class="feedback-desc">정답은 <strong>${escapeHtml(
              target.event
            )}</strong> (${escapeHtml(formatFullDate(target))}) 입니다.</div>`;
          }
          updateHeaderStats();
          document.getElementById("nextEventBtn").disabled = false;
        });
      });

      document.getElementById("nextEventBtn").addEventListener("click", () => {
        if (state.currentIndex + 1 < total) {
          state.currentIndex++;
          prepareNextEventChoice();
        } else {
          renderQuizResult();
        }
      });
    }

    /**
     * ==========================================================================
     * 9. 시간 순서 배열 퀴즈
     * ==========================================================================
     */
    function startOrderQuizSession() {
      const pool = getFilteredEvents();
      if (pool.length < 4) {
        renderNoFilterMatch();
        return;
      }
      state.orderPool = shuffle(pool).slice(0, 4);
      state.orderSelected = [];
      state.answered = false;
      renderOrderQuiz();
    }

    function renderOrderQuiz() {
      const main = document.getElementById("mainContent");
      const correctOrder = [...state.orderPool].sort((a, b) => a.id - b.id);

      main.innerHTML = `
        <div class="quiz-top-bar">
          <div class="quiz-meta"><span>⏳ 시간 순서 배열 (4개 사건)</span></div>
          <div class="streak-pill">🔥 ${state.streak}연속 정답</div>
        </div>

        <div class="question-box">
          <div class="question-tag">순서 배열 퀴즈</div>
          <div class="question-text">아래 4가지 사건을 일어난 순서대로(가장 이른 것부터) 선택하세요.</div>
          <div class="question-hint">아래 보기를 순서대로 클릭하면 위쪽 답안 칸에 배치됩니다.</div>
        </div>

        <div class="order-slots-label">
          <span>내가 배열한 순서 (${state.orderSelected.length} / 4)</span>
          ${
            !state.answered && state.orderSelected.length > 0
              ? `<button class="btn btn-secondary" id="resetOrderBtn" style="padding:4px 10px; font-size:0.78rem;">초기화</button>`
              : ""
          }
        </div>
        <div class="selected-sequence">
          ${
            state.orderSelected.length === 0
              ? `<div class="selected-empty">가장 먼저 일어난 사건부터 차례대로 클릭해 주세요.</div>`
              : state.orderSelected
                  .map((item, idx) => {
                    let cls = "";
                    if (state.answered) {
                      cls = correctOrder[idx].id === item.id ? "result-correct locked" : "result-wrong locked";
                    }
                    return `
                      <div class="order-item ${cls}" data-slot-index="${idx}">
                        <div style="display:flex; align-items:center;">
                          <span class="order-badge">${idx + 1}</span>
                          <span>${escapeHtml(item.event)}</span>
                        </div>
                        ${
                          state.answered
                            ? `<span class="order-date-reveal">${escapeHtml(formatFullDate(item))}</span>`
                            : `<span style="font-size:0.78rem; color:var(--text-muted);">취소 ✕</span>`
                        }
                      </div>
                    `;
                  })
                  .join("")
          }
        </div>

        <div class="order-slots-label"><span>선택 보기</span></div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          ${state.orderPool
            .map(item => {
              const picked = state.orderSelected.some(s => s.id === item.id);
              return `
                <div class="order-item in-pool ${picked ? "picked" : ""} ${state.answered ? "locked" : ""}" data-pool-id="${item.id}">
                  <span>${escapeHtml(item.event)}</span>
                  ${
                    state.answered
                      ? `<span class="order-date-reveal">${escapeHtml(formatFullDate(item))}</span>`
                      : `<span style="font-size:0.8rem; color:var(--primary); font-weight:700;">선택 +</span>`
                  }
                </div>
              `;
            })
            .join("")}
        </div>

        <div class="feedback-box" id="orderFeedback"></div>

        <div class="action-row">
          ${
            !state.answered
              ? `<button class="btn btn-primary" id="checkOrderBtn" ${state.orderSelected.length < 4 ? "disabled" : ""}>정답 확인하기</button>`
              : `<button class="btn btn-primary" id="nextOrderBtn">다음 순서 문제 →</button>`
          }
        </div>
      `;

      if (!state.answered) {
        document.querySelectorAll(".order-item.in-pool:not(.picked)").forEach(el => {
          el.addEventListener("click", () => {
            const found = state.orderPool.find(i => i.id === Number(el.dataset.poolId));
            if (found && state.orderSelected.length < 4) {
              state.orderSelected.push(found);
              renderOrderQuiz();
            }
          });
        });

        document.querySelectorAll(".selected-sequence .order-item").forEach(el => {
          el.addEventListener("click", () => {
            state.orderSelected.splice(Number(el.dataset.slotIndex), 1);
            renderOrderQuiz();
          });
        });

        const resetBtn = document.getElementById("resetOrderBtn");
        if (resetBtn) {
          resetBtn.addEventListener("click", () => {
            state.orderSelected = [];
            renderOrderQuiz();
          });
        }

        document.getElementById("checkOrderBtn").addEventListener("click", () => {
          state.answered = true;
          const isAllCorrect = state.orderSelected.every((item, idx) => item.id === correctOrder[idx].id);
          renderOrderQuiz();

          const feedback = document.getElementById("orderFeedback");
          const summary = correctOrder
            .map((it, i) => `${i + 1}. <strong>[${escapeHtml(formatFullDate(it))}]</strong> ${escapeHtml(it.event)}`)
            .join("<br/>");

          if (isAllCorrect) {
            state.streak++;
            feedback.className = "feedback-box success show";
            feedback.innerHTML = `<div class="feedback-title">✅ 완벽합니다! 시간 순서를 정확히 맞혔습니다.</div><div class="feedback-desc" style="margin-top:6px;">${summary}</div>`;
          } else {
            state.streak = 0;
            state.orderSelected.forEach((it, idx) => {
              if (it.id !== correctOrder[idx].id) addWrongId(it.id);
            });
            feedback.className = "feedback-box error show";
            feedback.innerHTML = `<div class="feedback-title">❌ 순서가 다릅니다. 올바른 연대순은 다음과 같습니다:</div><div class="feedback-desc" style="margin-top:6px;">${summary}</div>`;
          }
          updateHeaderStats();
        });
      } else {
        document.getElementById("nextOrderBtn").addEventListener("click", startOrderQuizSession);
      }
    }

    /**
     * ==========================================================================
     * 10. 전체 연표 암기장 뷰
     * ==========================================================================
     */
    function renderTimelineView() {
      const main = document.getElementById("mainContent");
      const eraFiltered = getFilteredEvents();
      const q = state.searchQuery.trim().toLowerCase();

      const visible = q
        ? eraFiltered.filter(
            item => formatFullDate(item).toLowerCase().includes(q) || item.event.toLowerCase().includes(q)
          )
        : eraFiltered;

      main.innerHTML = `
        <div class="search-bar-wrap">
          <input
            type="text"
            class="search-input"
            id="timelineSearchInput"
            placeholder="연도(예: 1948, 1987) 또는 키워드(예: 개헌, 제주, 유네스코) 검색..."
            value="${escapeHtml(state.searchQuery)}"
          />
          ${state.searchQuery ? `<button class="search-clear" id="clearSearchBtn">✕</button>` : ""}
        </div>

        <div class="timeline-controls">
          <span>표시 항목: <strong>${visible.length}개</strong></span>
          <label style="display:inline-flex; align-items:center; gap:6px; cursor:pointer; font-weight:700;">
            <input type="checkbox" id="blindModeToggle" ${state.blindMode ? "checked" : ""} />
            <span>날짜 가리기 (암기 모드)</span>
          </label>
        </div>

        ${
          visible.length === 0
            ? `<div class="empty-state">
                <div class="empty-icon">🔍</div>
                <div class="empty-title">일치하는 연표 항목이 없습니다.</div>
               </div>`
            : `<div class="timeline-list">
                ${visible
                  .map(
                    item => `
                    <div class="timeline-item">
                      <div class="timeline-header">
                        <span class="timeline-date ${state.blindMode ? "blinded" : ""}">${escapeHtml(
                      formatFullDate(item)
                    )}</span>
                        <span class="timeline-era-tag">${getEraLabel(item.year)}</span>
                      </div>
                      <div class="timeline-event">${escapeHtml(item.event)}</div>
                    </div>
                  `
                  )
                  .join("")}
              </div>`
        }
      `;

      const searchInput = document.getElementById("timelineSearchInput");
      searchInput.addEventListener("input", e => {
        state.searchQuery = e.target.value;
        renderTimelineView();
        const reInput = document.getElementById("timelineSearchInput");
        reInput.focus();
        reInput.setSelectionRange(reInput.value.length, reInput.value.length);
      });

      const clearBtn = document.getElementById("clearSearchBtn");
      if (clearBtn) {
        clearBtn.addEventListener("click", () => {
          state.searchQuery = "";
          renderTimelineView();
        });
      }

      document.getElementById("blindModeToggle").addEventListener("change", e => {
        state.blindMode = e.target.checked;
        renderTimelineView();
      });
    }

    /**
     * ==========================================================================
     * 11. 공통 결과 및 빈 상태 뷰
     * ==========================================================================
     */
    function renderQuizResult() {
      const main = document.getElementById("mainContent");
      const total = state.quizPool.length;
      const pct = total > 0 ? Math.round((state.score / total) * 100) : 0;

      main.innerHTML = `
        <div class="result-summary">
          <div class="score-circle">
            <span class="score-num">${pct}%</span>
            <span class="score-label">${state.score} / ${total} 정답</span>
          </div>
          <h2 class="empty-title">학습 라운드 완료!</h2>
          <p class="empty-desc">틀린 문제는 오답 노트에 자동 저장되어 언제든 다시 타이핑하며 복습할 수 있습니다.</p>
          <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
            <button class="btn btn-primary" id="retrySessionBtn">🔄 새 라운드 시작</button>
            ${
              state.wrongIds.size > 0
                ? `<button class="btn btn-secondary" id="goWrongBtn">📌 오답 노트 복습 (${state.wrongIds.size}개)</button>`
                : ""
            }
          </div>
        </div>
      `;

      document.getElementById("retrySessionBtn").addEventListener("click", initCurrentMode);
      const goWrongBtn = document.getElementById("goWrongBtn");
      if (goWrongBtn) {
        goWrongBtn.addEventListener("click", () => {
          document.querySelectorAll(".mode-tab").forEach(t => {
            t.classList.toggle("active", t.dataset.mode === "wrong-review");
          });
          state.currentMode = "wrong-review";
          initCurrentMode();
        });
      }
    }

    function renderEmptyWrongNote() {
      const main = document.getElementById("mainContent");
      main.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🎉</div>
          <div class="empty-title">오답 노트가 깨끗하게 비어 있습니다!</div>
          <div class="empty-desc">직접 날짜 입력 퀴즈나 스와이프 카드에서 틀린 문제가 생기면 이곳에 자동으로 모입니다.</div>
          <button class="btn btn-primary" id="goInputBtn">⌨️ 날짜 직접 입력 퀴즈 시작</button>
        </div>
      `;
      document.getElementById("goInputBtn").addEventListener("click", () => {
        document.querySelectorAll(".mode-tab").forEach(t => {
          t.classList.toggle("active", t.dataset.mode === "input-quiz");
        });
        state.currentMode = "input-quiz";
        initCurrentMode();
      });
    }

    function renderNoFilterMatch() {
      const main = document.getElementById("mainContent");
      main.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📭</div>
          <div class="empty-title">선택한 조건에 해당하는 문제가 부족합니다.</div>
          <div class="empty-desc">상단의 '날짜(월·일) 명시 사건만 보기' 체크를 해제하거나 시대를 '전체'로 변경해 보세요.</div>
        </div>
      `;
    }

    /**
     * ==========================================================================
     * 12. 초기화
     * ==========================================================================
     */
    window.onload = function () {
      loadWrongIds();
      renderEraChips();
      bindFiltersAndTabs();
      updateHeaderStats();
      initCurrentMode();
    };
  </script>
</body>
</html>
